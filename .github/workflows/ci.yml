name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm install -g firebase-tools
      - id: firebase
        run: echo "version=$(firebase --version)" >> "$GITHUB_OUTPUT"
      # The Firestore emulator is a ~130 MB jar that firebase-tools downloads
      # on first use; keyed on the firebase-tools version so a bump refreshes it.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ steps.firebase.outputs.version }}
      - run: npm run test:rules
